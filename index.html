<!doctype html>
<html lang="en" class="loading">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>%NAME%</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <meta name="description" content="%NAME%. There's a TARDIS." />
    <meta name="google-site-verification" content="Nh5qQj1ETYUVJkIcbgxDLqKXna_V0Lz-0jR_0rGM8nY" />
    <meta property="og:title" content="%NAME%" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="%URL%" />
    <!-- Fetched alongside the bundle, not after it runs: the loader waits on the stars. -->
    <link rel="preload" href="/stars.bin" as="fetch" crossorigin />
    <link rel="alternate" type="text/plain" href="/llms.txt" title="All content, as plain text for agents" />
    <script type="application/ld+json">%PERSON%</script>
    <!-- Critical CSS: applies before any script runs, so the page is dark from the first paint and the agent text never shows. -->
    <style>
      html, body { margin: 0; background: #04060b; }
      html.loading { overflow: hidden; }
      /* Off-screen, not display:none: text extractors and accessibility snapshots still read it. */
      #for-agents { position: absolute; left: -10000px; width: 1px; height: 1px; overflow: hidden; }
      #loader { position: fixed; inset: 0; z-index: 5; display: grid; place-items: center; background: #04060b; transition: opacity 0.8s; }
      #loader img { width: 56px; height: 56px; animation: materialise 2.4s ease-in-out infinite; }
      /* Never in the page's flow: it is the monitor's screen, placed in 3D, and must not lengthen the scroll. */
      #card { position: absolute; top: 0; left: 0; }
      /* Above the loader: an automated visitor may never see it lift. */
      #robot { position: fixed; top: 0; left: 0; right: 0; z-index: 6; margin: 0; padding: 0.9rem 1.2rem; background: #1b3a73; color: #f2f2f2; font: 0.9rem monospace; }
      @keyframes materialise { 0%, 100% { opacity: 0.12; } 50% { opacity: 1; } }
    </style>
  </head>
  <body>
    <div id="loader" aria-hidden="true"><img src="/favicon.svg" alt="" /></div>
    <section id="for-agents"><pre>%LLMS%</pre><p>Plain text: <a href="/llms.txt" tabindex="-1">/llms.txt</a></p></section>
    <p id="robot" hidden>%HELLO%</p>
    <div id="scene"></div>
    <p id="hint">scroll</p>
    <div id="runway"></div>
    <main id="card">%CARD%</main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
